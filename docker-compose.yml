name: campusclaw-go-dev
services:
  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8081}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend, backend]
  app:
    image: ${GO_IMAGE:-campusclaw-go:local}
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: server
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      STARTUP_MODE: application
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Set JWT_SIGNING_SECRET in process environment}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: campusclaw
      DB_USER: campusclaw
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in process environment}
      UPLOAD_ROOT: /uploads
      RAG_ENABLED: ${RAG_ENABLED:-false}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-campusclaw_chunks}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-}
      EMBEDDING_API_FORMAT: ${EMBEDDING_API_FORMAT:-ark_multimodal}
      DIALOGUE_BASE_URL: ${DIALOGUE_BASE_URL:-}
      DIALOGUE_API_KEY: ${DIALOGUE_API_KEY:-}
      DIALOGUE_MODEL: ${DIALOGUE_MODEL:-}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_MASTER_KEY: ${MCP_MASTER_KEY:-}
      MCP_KEY_ID: ${MCP_KEY_ID:-}
      MCP_ALLOWED_TARGETS: ${MCP_ALLOWED_TARGETS:-}
    volumes:
      - go-uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 6s
      retries: 6
    networks: [backend, outbound, mcp]
  mcp-demo:
    image: ${MCP_IMAGE:-campusclaw-mcp:local}
    profiles: [mcp]
    build:
      context: ./mcp-server
      target: server
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    read_only: true
    cap_drop: [ALL]
    networks: [mcp]
  initialize:
    image: ${GO_INIT_IMAGE:-campusclaw-go-init:local}
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: initializer
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      INITIALIZATION_MODE: ${INITIALIZATION_MODE:?Choose fresh or migrate explicitly}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Set JWT_SIGNING_SECRET in process environment}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: campusclaw
      DB_USER: campusclaw
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in process environment}
      UPLOAD_ROOT: /uploads
      SEED_TEACHER_A_PASSWORD: ${SEED_TEACHER_A_PASSWORD:-}
      SEED_STUDENT_A1_PASSWORD: ${SEED_STUDENT_A1_PASSWORD:-}
      SEED_TEACHER_B_PASSWORD: ${SEED_TEACHER_B_PASSWORD:-}
      SEED_STUDENT_B1_PASSWORD: ${SEED_STUDENT_B1_PASSWORD:-}
    volumes:
      - go-uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks: [backend]
  storage-init:
    image: alpine:3.23.3
    command: ["sh", "-c", "mkdir -p /uploads/tmp /uploads/files && chown 10001:10001 /uploads /uploads/tmp /uploads/files"]
    volumes:
      - go-uploads:/uploads
    network_mode: none
  mysql:
    image: mysql:8.4.4
    command: ["--ngram-token-size=2"]
    environment:
      MYSQL_DATABASE: campusclaw
      MYSQL_USER: campusclaw
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in process environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in process environment}
    volumes:
      - go-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [backend]
  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: [rag]
    volumes:
      - go-qdrant:/qdrant/storage
    networks: [backend]
networks:
  frontend:
  outbound:
  backend:
    internal: true
  mcp:
    internal: true
    ipam:
      config:
        - subnet: ${MCP_NETWORK_CIDR:-10.242.60.0/24}
volumes:
  go-mysql:
  go-uploads:
  go-qdrant:

