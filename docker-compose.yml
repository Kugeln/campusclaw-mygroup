name: campusclaw-go-dev
services:
  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8081}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend, backend]
  app:
    image: campusclaw-go:phase1
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      STARTUP_MODE: infrastructure
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: campusclaw
      DB_USER: campusclaw
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in process environment}
      UPLOAD_ROOT: /uploads
    volumes:
      - go-uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 6s
      retries: 6
    networks: [backend]
  storage-init:
    image: alpine:3.23.3
    command: ["sh", "-c", "mkdir -p /uploads/tmp /uploads/files && chown 10001:10001 /uploads /uploads/tmp /uploads/files"]
    volumes:
      - go-uploads:/uploads
    network_mode: none
  mysql:
    image: mysql:8.4.4
    environment:
      MYSQL_DATABASE: campusclaw
      MYSQL_USER: campusclaw
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in process environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in process environment}
    volumes:
      - go-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [backend]
networks:
  frontend:
  backend:
    internal: true
volumes:
  go-mysql:
  go-uploads:

