{% extends "base.html" %}
{% block title %}知识库问答 · CampusClaw{% endblock %}
{% block content %}
<p><a href="/materials">返回班级材料 / 上传材料</a></p>
<h1>知识库问答</h1>
<p id="knowledge-scope"></p>
<section class="card">
  <form id="ask-form">
    <label for="question">问题</label>
    <input id="question" name="question" required maxlength="2000" placeholder="请输入本班材料中的问题">
    <button type="submit" class="button-primary">提问</button>
  </form>
  <p id="ask-status" role="status"></p>
  <pre id="answer" class="reading-panel"></pre>
  <div id="sources"></div>
</section>
<script src="{{ url_for('static', filename='api.js') }}" defer></script>
<script src="{{ url_for('static', filename='knowledge.js') }}" defer></script>
{% endblock %}
