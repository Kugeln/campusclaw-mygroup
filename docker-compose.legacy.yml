services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Set JWT_SIGNING_SECRET in the server process environment}
      DATABASE: /var/lib/material-library/data/app.db
      UPLOAD_ROOT: /var/lib/material-library/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      SEED_TEACHER_A_PASSWORD: ${SEED_TEACHER_A_PASSWORD:-}
      SEED_STUDENT_A1_PASSWORD: ${SEED_STUDENT_A1_PASSWORD:-}
      SEED_TEACHER_B_PASSWORD: ${SEED_TEACHER_B_PASSWORD:-}
      SEED_STUDENT_B1_PASSWORD: ${SEED_STUDENT_B1_PASSWORD:-}
    volumes:
      - material-data:/var/lib/material-library
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  material-data:
